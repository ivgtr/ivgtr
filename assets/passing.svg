<svg xmlns="http://www.w3.org/2000/svg" width="480" height="230" viewBox="0 0 480 230" role="img" aria-labelledby="title description">
  <title id="title">Passing</title>
  <desc id="description">A quiet railway crossing. A train passes, the gate opens, and someone continues on their way.</desc>
  <!-- Self-contained: no scripts, external images, fonts, or network requests. -->
  <style>
    :root { --ink: #59636e; --soft: #d6dce2; --paper: #ffffff; --accent: #bd8051; }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #b4bec8; --soft: #333e49; --paper: #0d1117; --accent: #d7a778; }
    }
    .ink { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .soft { fill: none; stroke: var(--soft); stroke-width: 1; stroke-linecap: round; }
    .paper { fill: var(--paper); }
    .solid { fill: var(--ink); }
    .accent { fill: var(--accent); }
    .train { transform: translateX(-210px); animation: passing 16s linear infinite; }
    .gate { transform: rotate(-82deg); animation: gate 16s ease-in-out infinite; }
    .signal { opacity: 0; animation: signal 16s steps(1, end) infinite; }
    .lamp-left { animation: left-light 1.6s steps(1, end) infinite; }
    .lamp-right { animation: right-light 1.6s steps(1, end) infinite; }
    .walker { transform: translateY(0); animation: walk 16s linear infinite; }
    @keyframes passing {
      0%, 22% { transform: translateX(-210px); }
      59%, 100% { transform: translateX(490px); }
    }
    @keyframes gate {
      0%, 9%, 76%, 100% { transform: rotate(-82deg); }
      19%, 65% { transform: rotate(0deg); }
    }
    @keyframes signal { 0%, 72%, 100% { opacity: 0; } 5% { opacity: 1; } }
    @keyframes left-light { 0%, 100% { opacity: .9; } 50% { opacity: .12; } }
    @keyframes right-light { 0%, 100% { opacity: .12; } 50% { opacity: .9; } }
    @keyframes walk {
      0%, 76% { transform: translateY(0); opacity: 1; }
      90% { transform: translateY(-69px); opacity: 1; }
      92%, 98% { transform: translateY(-76px); opacity: 0; }
      99%, 100% { transform: translateY(0); opacity: 1; }
    }
    /* Keep the initial, fully drawn scene when motion is reduced. */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
